name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ 工程由 flutter create 现场生成，仓库里只放 lib/ 和 pubspec.yaml
      - name: 生成 Android 工程
        run: |
          flutter create --project-name hello_flutter --org com.example \
            --platforms=android /tmp/hf
          cp pubspec.yaml /tmp/hf/pubspec.yaml
          cp lib/main.dart /tmp/hf/lib/main.dart

      - name: 编译 release APK
        run: |
          cd /tmp/hf
          flutter pub get
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$GITHUB_WORKSPACE/out/hello-flutter.apk"

      # 手动运行 / 推 main：产物在 Actions 页面下载
      - uses: actions/upload-artifact@v4
        with:
          name: hello-flutter-apk
          path: out/hello-flutter.apk

      # 打 tag（如 v1）：直接挂到 Release，手机上点一下就能下 apk，不用解压
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/hello-flutter.apk
